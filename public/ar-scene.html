<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

        <!-- 8THWALL AND A-FRAME SCRIPTS --> 
        <script crossorigin="anonymous" src="/external/scripts/8frame-1.5.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>

    </head>
    
    <body>
        <script>
          // Read POI id from query string and sets model src
          // before A-Frame initializes the scene, to avoid race condition.
          // Fallback to 'via-senato' if missing parameter.
          const _poiId = new URLSearchParams(window.location.search).get('poi') || 'via-senato'
          document.write(
            '<a-assets>' +
            '  <a-asset-item id="poiModel" src="/models/' + _poiId + '.glb"></a-asset-item>' +
            '</a-assets>'
          )
        </script>

        <script src="/scripts/ar-components.js"></script>

        <!-- Custom coaching overlay — hidden by JS once SLAM tracking fires -->
        <div id="coaching-overlay">
          <div id="coaching-content">
            <div id="coaching-reticle">
              <div class="reticle-corner tl"></div>
              <div class="reticle-corner tr"></div>
              <div class="reticle-corner bl"></div>
              <div class="reticle-corner br"></div>
              <div id="reticle-scan-line"></div>
            </div>
            <p id="coaching-text">Frame the ground and<br>move your phone slowly</p>
          </div>
        </div>

        <style>
          #coaching-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.6s ease;
          }
          #coaching-overlay.hidden {
            opacity: 0;
          }

          #coaching-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
          }

          /* Reticle corners */
          #coaching-reticle {
            position: relative;
            width: 180px;
            height: 180px;
          }
          .reticle-corner {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: rgba(255,255,255,0.85);
            border-style: solid;
          }
          .reticle-corner.tl { top: 0; left: 0;  border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
          .reticle-corner.tr { top: 0; right: 0; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
          .reticle-corner.bl { bottom: 0; left: 0;  border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
          .reticle-corner.br { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

          /* Animated scan line */
          #reticle-scan-line {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            animation: scan 2s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
          }
          @keyframes scan {
            0%   { top: 8px;  opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: calc(100% - 8px); opacity: 0; }
          }

          /* Text */
          #coaching-text {
            color: rgba(255, 255, 255, 0.90);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            line-height: 1.55;
            letter-spacing: 0.01em;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
            margin: 0;
          }
        </style>

        <a-scene
            notify-ready
            tap-place
            light-check
            xrextras-runtime-error
            xrextras-loading
            renderer="colorManagement: true"
            xrweb="allowedDevices: any;"
            xrconfig
        >
            <a-assets>
                <!-- <a-asset-item id="nonna-model" src="/models/vecchietta.glb"></a-asset-item> -->
                <!-- <a-asset-item id="nonna-model" src="/models/vecchietta_danzante.glb"></a-asset-item> -->
                <a-asset-item id="nonna-model" src="/models/sciura (1).glb"></a-asset-item>
            </a-assets>

            <a-camera
                id="camera"
                position="0 8 8"
                raycaster="objects: .cantap"
                cursor="
                fuse: false; 
                rayOrigin: mouse;">
            </a-camera>

            <a-entity
                light="type: directional; intensity: 0.8; castShadow: true"
                position="1 4.3 2.5"
            >
            </a-entity>

            <a-light type="ambient" intensity="0.5"></a-light>

            <!-- uses cantap class to allow the ground to be clicked -->
            <a-box
                id="ground"
                class="cantap"
                scale="1000 2 1000"
                position="0 -0.99 0"
                material="shader: shadow; transparent: true; opacity: 0.4"
                shadow
            >
            </a-box>
        </a-scene>
    </body>
</html>
